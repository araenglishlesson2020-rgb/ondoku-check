<script>
// ===== 新しい入口（GitHub Pages）用：google.script.run の代わり（2026-10-13・生成ファイル／Index.html から _tools/新しい入口_GitHubPages版を生成.py で作る） =====
// 画面のコードはそのまま。google.script.run.withSuccessHandler(f).関数(引数) を
// fetch(POST {action:'rpc', fn, args}) で Apps Script の doPost（handleRpc_）に送る。
(function(){
  var EXEC="https://script.google.com/macros/s/AKfycbxXxNHogj9Rs5oVNbGio-xJLOPy-jmix20MLfGuqf0gW7tkv5sC9EGQKDyD7icAWCg/exec";
  var FNS=["login","loginByPw","checkActive","growth","companions","pickCompanion","getLessons","getOndoku","getOndokuUpdates","recAudio","saveRecord","saveState","loadState","visit","videoCheck","savePhoto","getPhotos"];
  function Runner(ok,ng){ this._ok=ok||null; this._ng=ng||null; }
  Runner.prototype.withSuccessHandler=function(f){ return new Runner(f,this._ng); };
  Runner.prototype.withFailureHandler=function(f){ return new Runner(this._ok,f); };
  Runner.prototype.withUserObject=function(){ return this; };
  FNS.forEach(function(fn){
    Runner.prototype[fn]=function(){
      var args=Array.prototype.slice.call(arguments), self=this;
      fetch(EXEC,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"rpc",fn:fn,args:args})})
        .then(function(r){ return r.json(); })
        .then(function(j){ return {j:j}; }, function(e){ return {e:e}; })
        .then(function(x){
          if(x.e || !x.j || !x.j.ok){ if(self._ng) self._ng(x.e||new Error((x.j&&x.j.error)||"rpc error")); }
          else if(self._ok) self._ok(x.j.r);
        });
    };
  });
  window.google=window.google||{}; window.google.script=window.google.script||{};
  window.google.script.run=new Runner();
  window.HARAPEKO_EXEC=EXEC;
  // URLの ?u=名前&k=合言葉（ホーム画面追加用）と、音読チェックが結果を返す先のURL
  document.addEventListener("DOMContentLoaded", function(){
    try{
      var q=new URLSearchParams(location.search);
      var a=document.getElementById("autoName"), b=document.getElementById("autoPw"), c=document.getElementById("execUrl");
      if(a) a.value=q.get("u")||""; if(b) b.value=q.get("k")||""; if(c) c.value=EXEC;
    }catch(e){}
  });
})();
</script>

<script>
// LINEのアプリ内ブラウザだと録音の再生（Blob音声）やマイクが不安定なので、
// 開いた瞬間にSafari/Chromeなど外部ブラウザへ逃がす（LINE公式パラメータ・通常ブラウザでは無視される）
(function(){
  try{
    var ua = navigator.userAgent || '';
    if(/Line/i.test(ua) && !/openExternalBrowser=1/.test(location.href)){
      var sep = location.href.indexOf('?') >= 0 ? '&' : '?';
      location.replace(location.href + sep + 'openExternalBrowser=1');
    }
  }catch(e){}
})();
</script>

<body>
<title>はらぺこ英語クエスト</title>
<style>
  :root{
    --bg:#EEF6E4; --bg2:#E3F0D2; --surface:#ffffff; --surface2:#F5FAEC;
    --ink:#26331B; --muted:#6E8059; --line:rgba(38,51,27,.12);
    --leaf:#3FA34D; --leaf-deep:#1E6B33; --leaf-lite:#7FCB63;
    --sun:#F4B740; --apple:#E4572E; --plum:#8A4FA0; --straw:#E85D75;
    --good:#3FA34D; --bad:#E4572E;
    --shadow:0 10px 30px rgba(38,51,27,.14); --shadow-sm:0 4px 14px rgba(38,51,27,.12);
    --font-round:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","M PLUS Rounded 1c","Rounded Mplus 1c",system-ui,sans-serif;
    --font-en:"Arial Rounded MT Bold","Verdana","Hiragino Maru Gothic ProN",system-ui,sans-serif;
    --font-body:"Hiragino Sans","ヒラギノ角ゴシック ProN",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141d14; --bg2:#101810; --surface:#1E2A1D; --surface2:#243020;
      --ink:#EAF3E0; --muted:#9DB08E; --line:rgba(234,243,224,.14);
      --leaf:#56C168; --leaf-deep:#2E8B45; --leaf-lite:#8FE17A;
      --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-sm:0 4px 14px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    --bg:#EEF6E4; --bg2:#E3F0D2; --surface:#ffffff; --surface2:#F5FAEC;
    --ink:#26331B; --muted:#6E8059; --line:rgba(38,51,27,.12);
    --leaf:#3FA34D; --leaf-deep:#1E6B33; --leaf-lite:#7FCB63;
    --shadow:0 10px 30px rgba(38,51,27,.14); --shadow-sm:0 4px 14px rgba(38,51,27,.12);
  }
  :root[data-theme="dark"]{
    --bg:#141d14; --bg2:#101810; --surface:#1E2A1D; --surface2:#243020;
    --ink:#EAF3E0; --muted:#9DB08E; --line:rgba(234,243,224,.14);
    --leaf:#56C168; --leaf-deep:#2E8B45; --leaf-lite:#8FE17A;
    --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-sm:0 4px 14px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  body{margin:0}
  #app{ font-family:var(--font-body); color:var(--ink);
    background:radial-gradient(120% 60% at 50% -10%, var(--bg2), transparent 60%), var(--bg);
    min-height:100dvh; -webkit-tap-highlight-color:transparent; }
  .wrap{max-width:480px; margin:0 auto; padding:16px 16px 44px; position:relative}
  .screen{display:none; animation:fade .28s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

  h1,h2,h3{font-family:var(--font-round); margin:0; text-wrap:balance; letter-spacing:.01em}
  .en{font-family:var(--font-en)}

  .hero{ background:linear-gradient(160deg,var(--leaf),var(--leaf-deep)); color:#fff;
    border-radius:26px; padding:20px 20px 22px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .hero::after{content:"🐛"; position:absolute; top:12px; right:16px; font-size:30px; opacity:.9}
  .kicker{font-family:var(--font-round); font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.85}
  .hero h1{font-size:28px; line-height:1.15; margin:4px 0 2px}
  .hero p{margin:6px 0 0; font-size:13.5px; opacity:.92}
  /* ===== 表紙 案A（2026-09-30）：あおむし＋きょうの つづき＋タイル。説明は ❓ページへ ===== */
  .hero-a{padding:16px 18px 18px; text-align:center}
  .hero-a::after{content:none}
  .hero-a .kicker{text-align:left; padding-right:48px}
  .catbig{font-size:64px; line-height:1.1; margin:6px 0 2px; cursor:pointer; min-height:70px}
  .catbig .gicon{margin:0}
  .catline{font-family:var(--font-round); font-size:15.5px; font-weight:700; opacity:.96; cursor:pointer}
  .qbtn{position:absolute; top:10px; right:10px; z-index:2; width:46px; height:46px; border-radius:50%; border:2px solid rgba(255,255,255,.75); background:rgba(255,255,255,.2); color:#fff; font-size:22px; cursor:pointer; font-family:var(--font-round)}
  .qbtn:active{transform:scale(.95)}
  .qbtn.hint{animation:pulseBtn 1.6s ease-in-out infinite; background:rgba(255,255,255,.38)}
  .fdots{letter-spacing:2px; color:var(--apple); font-size:13px}
  .bigcont{width:100%; margin-top:12px; text-align:left; background:var(--surface); border:3px solid var(--apple); border-radius:22px; padding:16px 18px;
    box-shadow:0 5px 0 color-mix(in srgb, var(--apple) 70%, #000), 0 0 0 5px color-mix(in srgb, var(--apple) 14%, transparent); cursor:pointer; display:flex; flex-direction:column; gap:3px; color:var(--ink)}
  .bigcont:active{transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--apple) 70%, #000)}
  .bigcont .bc-k{font-family:var(--font-round); font-size:15px; font-weight:800; color:var(--apple); letter-spacing:.03em}
  .bigcont .bc-t{font-size:21px; font-weight:800; line-height:1.25}
  .bigcont .bc-s{font-family:var(--font-round); font-size:14px; color:var(--muted)}
  .bigcont.done{border-style:dashed; cursor:default; box-shadow:none}
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
  .tile{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:10px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; box-shadow:var(--shadow-sm); color:var(--ink); min-height:78px; font-family:var(--font-round)}
  .tile:active{transform:translateY(1px)}
  .tile .ti{font-size:24px; line-height:1.1}
  .tile b{font-size:17px}
  .tile .tn{font-size:11px; color:var(--muted)}
  .bonusline{font-family:var(--font-round); font-size:13px; font-weight:700; color:var(--leaf-deep); text-align:center; margin-top:8px}
  .booktiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px}
  .btile{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; color:var(--ink); min-height:86px}
  .btile .bi{font-size:30px; line-height:1.1}
  .btile .bn{font-family:var(--font-round); font-size:12.5px; font-weight:700; text-align:center; line-height:1.2}
  .btile.on{border-color:var(--leaf); background:color-mix(in srgb, var(--leaf) 12%, var(--surface))}
  .btile.locked{opacity:.55}
  /* ❓ あそびかたページ */
  .hcards{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 -4px; padding:0 4px}
  .hcards::-webkit-scrollbar{display:none}
  .hcard{flex:0 0 100%; scroll-snap-align:center; background:var(--surface); border:1.5px solid var(--line); border-radius:24px; padding:26px 18px 20px; text-align:center; box-shadow:var(--shadow-sm); min-height:290px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px}
  .hcard .hpic{font-size:38px; line-height:1.25; letter-spacing:1px}
  .hcard .ht{font-family:var(--font-round); font-size:20px; font-weight:800; line-height:1.35}
  .hcard .hs{font-family:var(--font-round); font-size:15px; color:var(--muted); line-height:1.5}
  .hcard .hspk{margin-top:6px; font-size:14px; padding:8px 16px}
  .hdots{display:flex; justify-content:center; gap:8px; margin:12px 0 4px}
  .hdots span{width:9px; height:9px; border-radius:50%; background:var(--line); display:inline-block}
  .hdots span.on{background:var(--leaf)}
  #tmrCard .uchip.on{background:var(--leaf); color:#fff; border-color:var(--leaf)}

  .sec-label{font-family:var(--font-round); font-size:13px; color:var(--muted); margin:20px 2px 10px; font-weight:700}

  .lesson-card{ width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line);
    border-radius:20px; padding:16px 16px; box-shadow:var(--shadow-sm); cursor:pointer; margin-bottom:12px;
    display:flex; align-items:center; gap:14px; font-family:var(--font-round); color:var(--ink); transition:transform .12s}
  .lesson-card:active{transform:translateY(2px) scale(.995)}
  .lesson-card .badge{font-size:30px; flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
    background:var(--surface2); border:1px solid var(--line)}
  .lesson-card .lc-body{flex:1; min-width:0}
  .lesson-card .lc-title{font-size:17px; font-weight:700}
  .lesson-card .lc-sub{font-size:12px; color:var(--muted); margin-top:1px}
  .lesson-card .lc-prog{font-size:14px; margin-top:6px; letter-spacing:1px}
  .lesson-card .chev{color:var(--muted); font-size:22px; flex:none}
  .lesson-card.done{border-color:var(--leaf)}

  .fruitline{display:flex; gap:8px; align-items:center; margin-top:16px; font-size:26px}
  .fruitline .fr{filter:grayscale(1) opacity(.45); transition:.4s}
  .fruitline .fr.on{filter:none; transform:scale(1.12)}
  .fruitline .arrow{font-size:16px; opacity:.7}
  .fruitline .goal{margin-left:auto; font-size:30px}

  .catwrap{display:flex; justify-content:center; align-items:flex-end; height:70px; margin:14px 0 2px}
  .cat{display:flex; align-items:center; gap:1px}
  .seg{width:30px;height:30px;border-radius:50%;background:var(--leaf); box-shadow:inset -3px -4px 0 rgba(0,0,0,.14); margin-left:-8px; position:relative}
  .seg:first-child{margin-left:0}
  .seg.head{background:var(--apple); width:34px;height:34px; z-index:5}
  .seg.head::before,.seg.head::after{content:"";position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:#fff}
  .seg.head::before{left:6px} .seg.head::after{left:16px}
  .seg.pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .catcount{font-family:var(--font-round); font-size:13px; color:var(--muted); text-align:center; margin-top:-2px}
  .bfly{font-size:56px; animation:flutter 2.2s ease-in-out infinite}
  @keyframes flutter{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}

  /* 2026-09-10 ひろみさん指示：上から順にできるように縦1列。カードは横長（左＝Word/BOOK番号＋フルーツ、中＝名前、右＝✅できた／▶つぎはここ） */
  .stages{display:grid; grid-template-columns:1fr; gap:10px; margin-top:16px}
  .stage-card{ background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:10px 12px 10px 12px;
    text-align:left; cursor:pointer; box-shadow:var(--shadow-sm); display:grid; grid-template-columns:auto auto 1fr auto; grid-template-areas:"day fr nm st" "day fr sb st"; column-gap:10px; row-gap:0; align-items:center;
    transition:transform .12s ease; font-family:var(--font-round); color:var(--ink); position:relative; }
  .stage-card:active{transform:translateY(2px) scale(.99)}
  .stage-card .day{grid-area:day; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted); min-width:54px; text-align:center; line-height:1.15}
  .stage-card .fr{grid-area:fr; font-size:30px; line-height:1}
  .stage-card .nm{grid-area:nm; font-size:19px; font-weight:700; line-height:1.15; align-self:end}
  .stage-card .sb{grid-area:sb; font-size:11.5px; color:var(--muted); align-self:start}
  .stage-card .stars{grid-area:st; font-size:13px; letter-spacing:1px; text-align:right; min-height:18px; display:flex; flex-direction:column; align-items:flex-end; gap:2px}
  .stage-card .stars .ok{font-size:12px; color:var(--leaf); font-weight:700; letter-spacing:0}
  .stage-card.done{border-color:var(--leaf); background:color-mix(in srgb, var(--leaf) 9%, var(--surface))}
  .stage-card.done .day{color:var(--leaf)}
  .stage-card.done .fr::after{content:"✅"; position:absolute; left:58px; top:6px; font-size:14px}
  /* ▶ つぎはここ：まだやっていない最初のステージを目立たせる */
  .stage-card.next{border-color:var(--apple); border-width:2.5px; box-shadow:0 0 0 4px color-mix(in srgb, var(--apple) 18%, transparent), var(--shadow-sm)}
  .stage-card.next .day{color:var(--apple)}
  .stage-card.next .stars .nx{font-size:12px; color:var(--apple); font-weight:700; letter-spacing:0; animation:nxblink 1.4s ease-in-out infinite}
  .stage-card.todo{opacity:.85}
  @keyframes nxblink{0%,100%{opacity:1}50%{opacity:.45}}
  /* おまけステージ：点線わく＋見出しをオレンジに。区切り行は2列ぶち抜き */
  .stage-card.opt{border-style:dashed; opacity:.92}
  .stage-card.opt .day{color:var(--apple)}
  .stages .opt-divider{grid-column:1/-1; width:100%; font-size:12px; color:var(--muted); text-align:center; padding:6px 0 0}
  .fruitline .optfr{font-size:15px; opacity:.85; margin-left:2px; display:inline-flex; gap:2px; align-items:center}
  .fruitline .optfr .fr{font-size:15px}

  .scorebar{display:flex; gap:10px; margin-top:16px}
  .stat{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; text-align:center}
  .stat b{display:block; font-family:var(--font-en); font-size:22px; font-variant-numeric:tabular-nums; color:var(--leaf-deep)}
  .stat span{font-size:11px; color:var(--muted); font-family:var(--font-round)}

  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:18px}
  .link{background:none;border:none; color:var(--muted); font-family:var(--font-round); font-size:12.5px; cursor:pointer; padding:6px}
  .link:hover{color:var(--ink)}
  details.help{margin-top:14px; background:var(--surface2); border:1px solid var(--line); border-radius:16px; padding:2px 14px}
  details.help summary{font-family:var(--font-round); font-size:13px; padding:10px 0; cursor:pointer; color:var(--ink)}
  details.help p{font-size:12.5px; color:var(--muted); margin:0 0 10px; line-height:1.6}

  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .back{background:var(--surface); border:1px solid var(--line); border-radius:12px; height:40px; padding:0 12px; font-size:14px; font-family:var(--font-round); font-weight:700; cursor:pointer; color:var(--ink); flex:none; display:flex; align-items:center; gap:4px; white-space:nowrap}
  #homeFab{position:fixed; bottom:16px; right:16px; z-index:60; width:56px; height:56px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line); box-shadow:var(--shadow); font-size:26px; cursor:pointer; display:none; align-items:center; justify-content:center; line-height:1}
  #homeFab .fablbl{position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-family:var(--font-round); font-size:10px; color:var(--muted); white-space:nowrap}
  #growBadge{margin-top:10px; background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; font-family:var(--font-round); font-size:14px; box-shadow:var(--shadow)}
  #growBadge .gicon{font-size:30px; margin-right:8px; vertical-align:middle; display:inline-block; animation:growPop .5s ease}
  /* 🥚のいろ＝そのサイクルで うまれる ちょうちょの いろ（hue-rotate で 🐛🫛🦋 も同じ色に） */
  .gicon.cyc{border-radius:50%; padding:2px 4px; background:var(--cycbg,transparent)}
  .gicon.cyc .em{display:inline-block; filter:var(--cycf,none)}
  .gicon.bfi{padding:0; vertical-align:middle} .gicon.bfi svg{vertical-align:middle}
  .zukan .ze svg{vertical-align:middle}
  /* 🌳 なかまのもり：へんしんの「ドン！」演出と図鑑 */
  @keyframes dokan{0%{transform:scale(0) rotate(-12deg);opacity:0}55%{transform:scale(1.45) rotate(4deg)}75%{transform:scale(.9)}100%{transform:scale(1)}}
  .henshin-big{font-size:118px;line-height:1.15;animation:dokan .75s cubic-bezier(.2,1.3,.4,1);filter:drop-shadow(0 10px 22px rgba(0,0,0,.25))}
  .henshin-en{font-family:var(--font-en);font-size:30px;font-weight:800;color:var(--leaf-deep);letter-spacing:.02em}
  .zk{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:7px 2px 5px;font-size:26px;text-align:center;cursor:pointer;font-family:var(--font-round);line-height:1.15}
  .zk .en{font-size:9px;color:var(--muted);display:block;font-family:var(--font-en)}
  .zk.no{opacity:.45;filter:grayscale(1);cursor:default}
  .zk-series{font-family:var(--font-round);font-size:13px;color:var(--muted);margin:10px 0 4px;text-align:left}
  /* 🖐 手が止まった子への「ここだよ」パルス */
  @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .nudge{animation:pulseBtn .9s ease infinite; box-shadow:0 0 0 4px rgba(63,163,77,.25) !important}
  @keyframes growPop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .prog{flex:1}
  .prog .lbl{display:flex; justify-content:space-between; font-family:var(--font-round); font-size:12px; color:var(--muted); margin-bottom:5px}

  // そだちバッジ（通算でやった日数 t：1🐛/2🫛/3〜7🦋（4〜7日目は やった日ごとに なかまを3択で1ぴき→4ひきめで もりへ→🥚）。月曜に戻らない。2026-10-15 cycInfo 参照）
  var GROWTH=null;
  // ルール（2026-09-10/11 ひろみさん）：1日1つでもやれば1段階そだつ・3日で🦋（通算・月曜に戻らない）。4〜7日目に なかまを3びきから1ぴき（2 frogs式・永久保存）。4ひきで ちょうちょは森へ→新しい🥚（やった日7日で1サイクル）。何が生まれるかは実在の蝶53種から生徒ごとの順（bfFor）。レッスン完了は🏅
  // 🦋 サイクル（やった日7日で1まわり・2026-10-15 ズレ修正）：t=通算やった日数。t=0は さいしょの🥚。
  //   r(=pos)：1🐛 2🫛 3🦋うまれた 4〜7🦋＋なかま（やった日ごとに1ぴき＝4ひき）→ 7日目に 4ひきめを えらんだら ちょうちょは もりへ → 🥚（つぎの日 1つ やると つぎの🐛）
  //   旧 t%7（r=0🥚）は「4ひきめの日に🥚」になり、r=6の文「4ひきめ→たまご」とズレていた（ひろみさん報告 10/15）。なかまの権利の計算（サーバー entitled）は旧と同じ値。
  //   卵から何が生まれるか＝生徒ごとに順番がちがう（名前でシャッフル・53種ぜんぶ出るまで重複なし）

  function cycInfo(t){
    if(GROWTH && GROWTH.pos!=null){ var cy=Number(GROWTH.cyc)||0; return {c:cy, r:GROWTH.stale?0:(Number(GROWTH.pos)||0), pos:Number(GROWTH.pos)||0, stale:!!GROWTH.stale, sp:bfFor(cy)}; }
    t=Math.max(0,Number(t)||0); if(t===0) return {c:0, r:0, pos:0, sp:bfFor(0)}; var c=Math.floor((t-1)/7), r=((t-1)%7)+1; return {c:c, r:r, pos:r, sp:bfFor(c)}; }
  // 7日目で 4ひきめを えらびおわった（＝ちょうちょは もりへ・🥚表示）
  function cycFlown(ci){ return ci.r===7 && !!COMP && !((COMP.pending||0)>0); }
  // 2026-10-16 名前を「漢字姓＋ひらがな名」に統一。ちょうちょの順番は名前から作るので、サーバーが返す「種」（旧名・SEED）を優先して図鑑が変わらないようにする
  function bfPerm(){ var n=BUTTERFLIES.length, a=[]; for(var i=0;i<n;i++) a.push(i);
    var seed=0, nm=String(SEED||USER||''); for(var k=0;k<nm.length;k++) seed=(seed*31+nm.charCodeAt(k))>>>0; seed=seed||7;
    for(var i2=n-1;i2>0;i2--){ seed=(seed*1103515245+12345)>>>0; var j2=seed%(i2+1); var tmp=a[i2]; a[i2]=a[j2]; a[j2]=tmp; } return a; }
  function bfFor(c){ var perm=bfPerm(); return BUTTERFLIES[perm[c%perm.length]]; }
  function bfIcon(sp,size){ return '<span class="gicon bfi">'+bfSVG(sp,size||36)+'</span>'; }
  function growthMsg(g){
    var t=(g.tdays!=null)?g.tdays:((g.wdays!=null)?g.wdays:(g.days||0)); // 通算（月曜に戻らない）
    var ci=cycInfo(t), r=ci.r, sp=ci.sp, pend=(COMP&&COMP.pending)||0, nth=(ci.c+1)+'かいめ';
    if(ci.stale) return {i:'🥚', t:'ひさしぶり！しばらく あいたので '+(ci.pos>=3?sp.ja+'は もりへ とんで いって、':'')+'あたらしい たまごに なったよ。きょう 1つ やると あおむしが うまれる'+(pend>0?'。なかまも えらべるよ 🐾':'')};
    if(cycFlown(ci)) return {i:'🥚', t:'なかま 4ひき！'+sp.ja+'は もりへ とんで いったよ。あたらしい たまご。あした 1つ やると '+(ci.c+2)+'かいめの あおむしが うまれるよ'};
    if(r>=3 && pend>0){ var pk=Number(COMP&&COMP.picked)||0, en=(COMP&&COMP.entitled!=null)?Number(COMP.entitled):null;
      var nk=(en!=null)? pk-(en-Math.max(0,r-3))+1 : pk-4*ci.c+1; // この ちょうちょの 何びきめか（まえの ちょうちょの ぶんが のこっていたら 0以下→出さない）
      return {i:'🦋', sp:sp, t:sp.ja+'！きょうの なかまを えらぼう 🐾'+(nk>=4?'（4ひきめ → もりへ とんで、あたらしい たまごに）':(nk>=1?'（'+nk+'ひきめ）':''))}; }
    if(r==7) return {i:'🦋', sp:sp, t:sp.ja+'（'+sp.en+'）。4ひきめの なかまを えらぶと もりへ とんで、あたらしい たまごに'};
    if(r>=3) return {i:'🦋', sp:sp, t:sp.ja+'（'+sp.en+'）が うまれた！あした 1つ やると なかまを 1ぴき えらべるよ（あと '+(7-r)+'ひきで つぎの たまご）'};
    if(r==2) return {i:'🫛', t:'さなぎに なった！あと 1日 やると ちょうちょ。なにが うまれるかな？'};
    if(r==1) return {i:'🐛', t:'あおむしが うまれた！あと 2日 やると ちょうちょ！'};

  }

  function foodCheck(id){
    state.foodClaims=state.foodClaims||{};
    var due=Math.floor(foodUnits(id)/3), had=state.foodClaims[id]||0; if(due<=had) return 0;
    var add=due-had; state.foodClaims[id]=due;
    var use=Math.min(add, state.foodDebt||0); if(use>0){ state.foodDebt-=use; add-=use; } // 旧ルールで先にもらっていた分
    if(add>0) state.foodPending=(state.foodPending||0)+add;
    return add;
  }

  var FOODSYNC={cloud:false, recs:false};
  function foodMigrate(){
    if((state.foodV||0)>=2) return;
    state.recN=state.recN||{}; state.foodClaims=state.foodClaims||{};
    var k; for(k in (state.recSent||{})){ if(!state.recN[k]) state.recN[k]=1; }
    var ids={}; for(k in (state.lessons||{})) ids[k]=1; for(k in state.recN) ids[k]=1;
    var totalDue=0; for(k in ids){ var d=Math.floor(foodUnits(k)/3); state.foodClaims[k]=d; totalDue+=d; }
    var granted=(state.foodPending||0); (state.foods||[]).forEach(function(f){ granted+=(f.n||1); });
    if(totalDue>granted) state.foodPending=(state.foodPending||0)+(totalDue-granted);
    else state.foodDebt=granted-totalDue;
    state.foodV=2; save();
  }

  function foodSync(recs){
    try{
      if(recs){
        // レッスン名で照合。むかしの 録音は 表記が ちがう ことが あるので、UFLI BOOK は「L番号」でも 照合
        var map={}, byL={}; LESSONS.forEach(function(x){ if(x.mode!=="ondoku") return; map[fullTitle(x)]=x.id;
          var mm=/^od_l(\d+)$/.exec(String(x.id)); if(mm) byL[mm[1]]=x.id; });
        var cnt={}; recs.forEach(function(r){ var t=String(r.lesson||""), id=map[t];
          if(!id){ var m2=/(?:^|[^A-Za-z])L(\d+)/.exec(t); if(m2 && t.indexOf("Horizon")<0) id=byL[m2[1]]; }
          if(id) cnt[id]=(cnt[id]||0)+1; });
        state.recN=state.recN||{}; for(var id in cnt){ if(cnt[id]>(state.recN[id]||0)) state.recN[id]=cnt[id]; }
      }
      if(!USER || !FOODSYNC.cloud || !FOODSYNC.recs) return; // ☁️と🎙️一覧の両方が そろってから
      if((state.foodV||0)<2){ foodMigrate(); }
      else { var ch=0, k, ids={}; for(k in (state.lessons||{})) ids[k]=1; for(k in (state.recN||{})) ids[k]=1;
        for(k in ids) ch+=foodCheck(k); if(ch || recs) save(); }

  function foodChoices(){
    var have={}; (state.foods||[]).forEach(function(f){ have[f.id]=1; });
    var rest=shuffle(FOODS.filter(function(f){ return !have[f.id]; })), own=shuffle(FOODS.filter(function(f){ return have[f.id]; }));
    var out=rest.slice(0,2); if(own.length) out.push(own[0]); while(out.length<3 && rest.length>out.length) out.push(rest[out.length]);
    while(out.length<3 && own.length>1){ var o=own[out.length-2]; if(o && out.indexOf(o)<0) out.push(o); else break; }

  // ===== 🎯 きょうのクエスト・ルーレット（おすすめのBOOKとハートワードを1つずつ） =====
  // 基準：①とちゅうまでやってある ②はじめたけど未クリア ③順番どおり次の未経験 ④⭐がまだ満点でない復習
  function recPick(){
    function score(L){
      var ls=lstate(L.id), stg=reqStages(L); // おすすめ判定は必須ステージだけで
      var doneAll=stg.every(function(s){return ls.cleared[s.id]>0});
      var started=stg.some(function(s){return ls.cleared[s.id]>0});
      var hasRz=false; if(ls.resume){ for(var k in ls.resume){ var r=ls.resume[k]; if(r && r.i>0 && r.i<r.total){hasRz=true;break;} } }
      return {doneAll:doneAll, started:started, rz:hasRz, stars:lessonStars(ls,L), max:stg.length*3};
    }
    function pick(arr){
      if(!arr.length) return null;
      var infos=arr.map(function(L){return {L:L, s:score(L)}});
      var r=infos.filter(function(x){return x.s.rz})[0];
      if(r) return {L:r.L, why:'とちゅうまで やってあるよ。つづきから やろう！'};
      r=infos.filter(function(x){return x.s.started && !x.s.doneAll})[0];
      if(r) return {L:r.L, why:'はじめてあるけど まだクリアしてない。きょう クリアしよう！'};
      r=infos.filter(function(x){return !x.s.started})[0];
      if(r) return {L:r.L, why:'つぎは これ！はじめての クエストだよ'};
      r=infos.filter(function(x){return x.s.stars<x.s.max})[0];
      if(r) return {L:r.L, why:'💎おたからが のこってるよ。⭐⭐⭐に しよう！'};
      return {L:infos[0].L, why:'ぜんぶ ⭐⭐⭐！わすれてないか もういちど チャレンジ'};
    }
    var books=LESSONS.filter(function(L){return L.mode==="ondoku" && String(L.book||"").indexOf("UFLI")>=0 && !lockedLesson(L);});
    var hearts=LESSONS.filter(function(L){return L.mode==="heart" && !lockedLesson(L);});
    // 🎯 技クエスト範囲（カルテ由来・シート「技クエスト」）があれば、その範囲のBOOKを最優先
    var wz=COMP && COMP.waza, b=null;
    if(wz && wz.lo && wz.hi){
      var inR=books.filter(function(L){ var m=String(L.unit||"").match(/(\d+)/); return m && +m[1]>=wz.lo && +m[1]<=wz.hi; });
      var left=inR.filter(function(L){ var s=score(L); return !(s.doneAll && s.stars>=s.max); });
      if(left.length){ b=pick(left); if(b) b.why='🎯 きみせんようの クエストゾーン！ '+b.why; }
    }
    if(!b) b=pick(books);
    var h=pick(hearts);
    if(b) b.openId=(pairedWord(b.L)||b.L).id;
    if(h) h.openId=h.L.id;
    return {book:b, heart:h};
  }

  // 録音の音声データをGAS経由で受け取って再生（Drive共有に依存しない）
  window.playRec=function(btn,id){

      google.script.run.withSuccessHandler(function(res){

          console.error('playRec error:', res && res.error, res && res.detail);
          btn.textContent='きけなかった…もういちど'; btn.disabled=false; return;
        }
        try{
          var bin=atob(res.b64), arr=new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
          var au=document.createElement('audio');
          au.controls=true; au.style.width='100%'; au.style.height='32px';
          au.src=URL.createObjectURL(new Blob([arr],{type:res.mime||'audio/mp4'}));
          btn.parentNode.replaceChild(au,btn);
          au.play().catch(function(e){ console.error('audio play() failed:', e); });
        }catch(e){
          console.error('playRec decode error:', e);
          btn.textContent='きけなかった…もういちど'; btn.disabled=false;
        }
      }).withFailureHandler(function(e){
        console.error('recAudio call failed:', e);
        btn.textContent='きけなかった…もういちど'; btn.disabled=false;

  function renderLessons(){
    dailyCheck(); howtoHint();
    renderMyRecsCard(); renderFootBar();
    var box=$("#lessonList"); box.innerHTML="";
    $("#lsKicker").textContent = USER ? ("こんにちは、"+USER+" さん") : "New Horizon 2 · 単語トレーニング";

    // 🎯ルーレットは廃止（2026-09-10 ひろみさん：その人に最適なものが出ない）→ かわりに「▶ つづきから」カード
    var qr=$("#rouletteBar"); if(qr) qr.innerHTML="";
    renderContinue();
    $("#logoutBtn").style.display = CONFIG.requireLogin ? "" : "none";
    var ordered=orderedLessons();
    // Lv1：教科書／シリーズ（縦に並べる。順＝BOOK→ハートワード→中2）
    var books=[]; ordered.forEach(function(L){ var b=L.book||"その他"; if(books.indexOf(b)<0)books.push(b); });
    var bookPri=function(b){ if(b==="UFLI BOOK")return 0; if(b.indexOf("ハートワード")>=0||b.indexOf("Heart")>=0)return 1; if(b.indexOf("New Horizon")>=0)return 2; return 3; };

    var CT=continueTarget(); // ▶ つづきのレッスン（初期表示の教科書・級はこれに合わせる）
    if(!state.selectedBook || books.indexOf(state.selectedBook)<0) state.selectedBook=(CT&&books.indexOf(CT.book||"その他")>=0)?(CT.book||"その他"):books[0];
    // 教材＝絵つきタイル3つ（📖UFLI BOOK／🩷ハートワード／🏫New Horizon）。コース外は🔒（タップで案内）
    var bookIcon=function(b){ if(b==="UFLI BOOK")return ["📖","UFLI BOOK"]; if(b.indexOf("ハートワード")>=0||b.indexOf("Heart")>=0)return ["🩷","ハートワード"]; if(b.indexOf("New Horizon")>=0)return ["🏫","New Horizon"]; if(b.indexOf("651")>=0||b.indexOf("必修")>=0)return ["🎒",b]; return ["📚",b]; };

      t.innerHTML='<span class="bi">'+(lk?'🔒':bi[0])+'</span><span class="bn">'+bi[1]+'</span>';
      t.onclick=function(){ if(lk){ showLockedModal({book:b}); return; } state.selectedBook=b; state.selectedUnit=null; save(); renderLessons(); }; bb.appendChild(t); });
    // Lv2：選択中の教科書のユニット チップ
    var inBook=ordered.filter(function(L){return (L.book||"その他")===state.selectedBook;});
    var units=[]; inBook.forEach(function(L){ var u=L.unit||"その他"; if(units.indexOf(u)<0)units.push(u); });
    // 初期ユニット：UFLI系は「入門」（先頭）、教科書は最新の「Unit ○」（音読のStage Activity等は初期選択にしない）
    if(!state.selectedUnit || units.indexOf(state.selectedUnit)<0){
      if(CT && (CT.book||"その他")===state.selectedBook && units.indexOf(CT.unit||"その他")>=0) state.selectedUnit=CT.unit||"その他";
      else if(state.selectedBook.indexOf("UFLI")>=0) state.selectedUnit=units[0];

    units.forEach(function(u){ var chip=document.createElement("button"); chip.className="uchip"+(u===state.selectedUnit?" on":""); chip.textContent=u;
      chip.onclick=function(){ state.selectedUnit=u; save(); renderLessons(); }; ub.appendChild(chip); });
    // 🔢 L番号でひらく（UFLI BOOKだけ）：番号でおぼえている子は 級をさがさず直接ひらける
    if(state.selectedBook==="UFLI BOOK"){
      var jb=document.createElement("div"); jb.className="jumpbar";
      jb.innerHTML='<span>🔢 L番号で ひらく</span><input type="number" inputmode="numeric" min="7" max="128" placeholder="L" id="jumpIn">'+
        '<button class="btn go" id="jumpGo">ひらく</button>'+(state.jumpN?'<button class="uchip sm" id="jumpClr">✕ L'+state.jumpN+'だけ表示中</button>':'');
      box.appendChild(jb);

      jb.querySelector("#jumpGo").onclick=go;
      jb.querySelector("#jumpIn").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } };
      var jc=jb.querySelector("#jumpClr"); if(jc) jc.onclick=function(){ state.jumpN=null; save(); renderLessons(); };
    } else state.jumpN=null;
    // Lv3：選択中の教科書＋ユニットのレッスンだけ表示。できたレッスンも たたまず そのまま（🏅＋回数＋「🔁 もう一回」で くり返しが見える）
    var listL=inBook.filter(function(L){return (L.unit||"その他")===state.selectedUnit;});
    if(state.jumpN){ var jn=state.jumpN; listL=inBook.filter(function(L){ var nm=lessonNum(L); return nm&&nm.n===jn; }); }
    if(state.selectedBook==="UFLI BOOK") listL=sortUfli(listL); // L番号順（単語シートと音読シートの並びに左右されない）
    listL.forEach(function(L){
      if(pairedWord(L)) return; // 本文（od_○○）は単語レッスンのカードに統合
      if(lockedLesson(L)){
        var lc=document.createElement("button");

      var fruits=frMap(reqStages(L),ls)+(P?frMap(reqStages(P),ps):'');

      var starsN=lessonStars(ls,L), starMax=reqStages(L).length*3, gemsN=ls.gems||0;

      var rounds=done?lessonRounds(L):0;
      var prog = (done?'<span class="rep">🏅 '+rounds+'回 できた</span>':fruits+'　') + '⭐'+starsN+'/'+starMax+'　💎'+gemsN;
      var rdN=(P?ps:(L.mode==="ondoku"?ls:null)); if(rdN && rdN.reads) prog+='　📖'+rdN.reads+'回';
      var nxL=nextStageOf(L); if(nxL) prog+='<div class="lc-next">▶ つぎは '+stageLabel(nxL.L,nxL.s)+' '+nxL.s.fr+' '+nxL.s.nm+'</div>';
      else { var rpL=nextRepeatOf(L); if(rpL) prog+='<div class="lc-next">🔁 もう一回（'+(rounds+1)+'回目）→ '+stageLabel(rpL.L,rpL.s)+' '+rpL.s.fr+' '+rpL.s.nm+'</div>'; }
      var c=document.createElement("button");
      c.className="lesson-card"+(done?" done":"");
      var ttl=L.title;
      c.innerHTML='<div class="badge">'+(done?'🏅':L.badge)+'</div>'+
        '<div class="lc-body"><div class="lc-title">'+ttl+'</div><div class="lc-sub">'+L.sub+'</div>'+
        '<div class="lc-prog">'+prog+'</div></div><div class="chev">›</div>';
      c.onclick=function(){ openLesson(L.id); };
      box.appendChild(c);
    });
  }
  // 🔢 L番号 → そのレッスンをひらく（枝番 a/b/c が複数ある時は その番号だけ一覧に出す）
  function jumpToLesson(n){
    var hit=orderedLessons().filter(function(L){ var nm=lessonNum(L); return nm&&nm.n===n&&!pairedWord(L); });
    if(!hit.length){ toastMsg("L"+n+" は まだ ないよ"); return; }
    if(hit.length===1){ if(lockedLesson(hit[0])){ showLockedModal(hit[0]); return; } state.selectedBook=hit[0].book||"その他"; state.selectedUnit=hit[0].unit||"その他"; state.jumpN=null; save(); openLesson(hit[0].id); return; }
    state.selectedBook=hit[0].book||"その他"; state.selectedUnit=hit[0].unit||"その他"; state.jumpN=n; save(); renderLessons();
  }
  function toastMsg(t){ var m=$("#modal"); m.innerHTML='<div class="big-fruit">🔎</div><h2>'+t+'</h2><button class="btn go" id="ok" style="margin-top:12px">わかった！</button>'; $("#overlay").classList.add("on"); $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); }; }

  function openLesson(id){ var L=LESSONS.filter(function(l){return l.id===id})[0]; if(!L) return; if(lockedLesson(L)){ showLockedModal(L); return; } state.lastLesson=id; save(); LES=L; LS=lstate(id); renderHome(); show("home"); }
  // ===== ▶ つづきから（2026-09-10）：さいごにやったレッスンが🦋前ならそれ、🦋済みならその次の未完了。何もなければ一覧の先頭の未完了 =====
  function lessonCandidates(){ return orderedLessons().filter(function(L){ return !pairedWord(L) && !lockedLesson(L); }); }
  function lessonNum(L){ var m=/^(?:od_)?l(\d+)([a-z]?)$/.exec(String(L.id||"")); return m?{n:+m[1],br:m[2]}:null; }
  // UFLI BOOK は L番号順（枝番 a→b→c）。ほかは一覧の並び順
  function sortUfli(list){ return list.slice().sort(function(a,b){ var A=lessonNum(a)||{n:0,br:""}, B=lessonNum(b)||{n:0,br:""}; return (A.n-B.n)||(A.br<B.br?-1:A.br>B.br?1:0); }); }
  function continueTarget(){
    var C=lessonCandidates(); if(!C.length) return null;
    var isDone=function(L){ return mergedAllDone(L,lstate(L.id)); };
    var last=null; if(state.lastLesson){ last=C.filter(function(L){ return L.id===state.lastLesson || (pairedOndoku(L)||{}).id===state.lastLesson; })[0]||null; }
    if(last && !isDone(last)) return last;
    if(last){ // 同じ教科書（シリーズ）の中で、そのレッスンより後の未完了 → UFLI BOOKなら L番号順
      var S=C.filter(function(L){ return (L.book||"その他")===(last.book||"その他"); }); if(last.book==="UFLI BOOK") S=sortUfli(S);
      var i=S.indexOf(last); for(var k=i+1;k<S.length;k++){ if(!isDone(S[k])) return S[k]; }
    }
    var all=C.filter(function(L){ return !isDone(L); }); if(!all.length) return null;
    var uf=all.filter(function(L){ return L.book==="UFLI BOOK"; }); return uf.length?sortUfli(uf)[0]:all[0]; // 何も記録がなければ UFLI BOOK の最初の未完了（小学生の入口）
  }
  function lessonLabel(L){ return (L.book&&L.book.indexOf("UFLI BOOK")<0&&L.unit?(L.unit+" "):"")+L.title; }
  function renderContinue(){
    var cb=$("#contBar"); if(!cb) return; cb.innerHTML="";
    if(!USER) return;
    var L=continueTarget();
    if(!L){ // ぜんぶ🏅 → 回数がいちばん少ないレッスン（同じなら上から）を「もう一回」で開く
      var C=lessonCandidates(), R=null; C.forEach(function(x){ var n=lessonRounds(x); if(!R || n<R.n) R={L:x,n:n}; });
      if(!R){ cb.innerHTML='<div class="bigcont done"><span class="bc-k">🏅 ぜんぶ できた！</span><span class="bc-t">すきな ところを もう一回 やってみよう</span></div>'; return; }
      var rp=nextRepeatOf(R.L); var b=document.createElement("button"); b.className="bigcont";
      b.innerHTML='<span class="bc-k">🏅 ぜんぶ できた！ → 🔁 もう一回（'+(R.n+1)+'回目）</span><span class="bc-t">'+(R.L.badge||"📖")+' '+lessonLabel(R.L)+'</span>'+
        (rp?('<span class="bc-s">'+stageLabel(rp.L,rp.s)+' '+rp.s.fr+' '+rp.s.nm+'</span>'):'');
      b.onclick=function(){ state.selectedBook=R.L.book||"その他"; state.selectedUnit=R.L.unit||"その他"; state.jumpN=null; save(); openLesson(R.L.id); };
      cb.appendChild(b); return; }
    var nx=nextStageOf(L);
    var c=document.createElement("button"); c.className="bigcont";
    c.innerHTML='<span class="bc-k">▶ きょうの つづき</span><span class="bc-t">'+(L.badge||"📖")+' '+lessonLabel(L)+'</span>'+
      (nx?('<span class="bc-s">'+stageLabel(nx.L,nx.s)+' '+nx.s.fr+' '+nx.s.nm+'</span>'):'');
    c.onclick=function(){ state.selectedBook=L.book||"その他"; state.selectedUnit=L.unit||"その他"; state.jumpN=null; save(); openLesson(L.id); };
    cb.appendChild(c);
  }

  // 🔒 コース制御（3段階）。「生徒」シートの「コース」列で切り替え：
  //   「小学生」→ UFLI だけ／「小学生上級」→ UFLI＋中学必修語／空欄・「中学生」→ ぜんぶ
  // 教材のランク＝book名で自動判定：UFLIを含む=1、必修を含む=2（中学必修語タブ）、それ以外（中学教科書など）=3
  // ★中学必修語タブを単語シートに足す時は、教科書名に「必修」を入れること（例：中学必修語（UFLI順））
  // 中学651は全員開放（2026-07-13ひろみ指示）。ランク2に戻す時は "651" を rank2 側へ移す
  function bookRank(b){ b=String(b||""); if(b.indexOf("UFLI")>=0||b.indexOf("651")>=0) return 1; if(b.indexOf("必修")>=0) return 2; return 3; }

  // ===== ステージ本体 =====
  var cur=null, stepSeq=0;
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function stageWords(id){

  function startStage(id, list, isReview){
    if(LES && LES.mode==="ondoku"){ startOndoku(id); return; } // 音読は専用エンジンへ
    if(LES && LES.mode==="heart" && id==="check"){ heartCheck(); return; } // 🎤 ハートワードのマイク判定
    // 📌 とちゅうでやめた記録があれば「つづきから？」と聞く（復習・お宝ひろいは対象外）
    var rz=(!list && !isReview && LS.resume) ? LS.resume[id] : null;
    if(rz && rz.i>0 && rz.i<rz.total){ showResumeModal(id, rz); return; }
    beginStage(id, list, isReview, null);

  function beginStage(id, list, isReview, rz){
    var items = (list&&list.length)? list : stageWords(id);
    cur=null;
    if(rz && rz.ens){ // 保存した出題順のまま復元。単語シートが変わっていたら合わないので最初から
      var pool={}; items.forEach(function(w){ pool[String(w.en)]=w; });
      var ordered=rz.ens.map(function(e){return pool[e]}).filter(Boolean);
      if(ordered.length===rz.ens.length && rz.i<ordered.length){
        cur={id:id, items:ordered, i:rz.i, firstTry:rz.firstTry||0, combo:0, gained:rz.gained||0,
             missed:(rz.missed||[]).map(function(e){return pool[e]}).filter(Boolean), isReview:false};

  // ===== 音読クエスト（きく・リピート・シャドー・チェック） =====

  var AUDIO_BASE="https://araenglishlesson2020-rgb.github.io/ondoku-check/";

  function ttsSay(t,rate,onend){

  // 🔁 リピート：1文ずつ「お手本→まねして言う」。自己評価で進む。

  // 🎤 チェック：マイク判定ページ（別タブ）を開く。結果は postMessage で戻る。
  // 2026-10-16 ひろみさん「全文は小学生にはしんどい」→ 3文／5文／10文／ぜんぶ を えらべる。
  //   えらぶ文＝そのレッスンで練習する単語（対になる Word の10語）が 入っている文を優先（同点は お話の順）。よむ順は お話の順のまま。
  //   📖よんだ回数・🌍ごちそうは「ぜんぶ」の時だけ 数える（3文で 1回読んだ ことには しない）。⭐・スコア・💎は どれでも つく。
  var OD_PICKS=[3,5,10];
  function odTargetWords(L){ var W=pairedWord(L), out={}; ((W&&W.words)||[]).forEach(function(w){ var k=normEnA(w.en); if(k) out[k]=1; }); return out; }
  function odSentScore(en, tg){
    var n=0, seen={};
    String(en).toLowerCase().split(/[^a-z']+/).forEach(function(t){ t=t.replace(/'/g,""); if(!t||seen[t]) return;
      if(tg[t] || tg[t.replace(/(es|s|ed|ing)$/,"")]){ seen[t]=1; n++; } });
    return n;
  }
  function odPickSents(L, n){
    var S=L.sents||[]; if(!n || n>=S.length) return S.slice();
    var tg=odTargetWords(L);
    var idx=S.map(function(s,i){ return {i:i, sc:odSentScore(s.en,tg)}; });
    idx.sort(function(a,b){ return (b.sc-a.sc) || (a.i-b.i); });
    return idx.slice(0,n).map(function(x){return x.i}).sort(function(a,b){return a-b}).map(function(i){ return S[i]; });
  }
  // いま ひらいた チェックが「えらんだ文だけ」だったか（同じ本・30分いない）
  function odPartialFor(id){ var p=state.odPart; if(!p || p.id!==id || !(p.n<p.total) || Date.now()-(p.t||0)>30*60000) return null; return p; }
  function odCheck(meta){
    var b=$("#stageBody"), S=LES.sents||[], total=S.length; odSetBar(0,total,meta);
    var opts=OD_PICKS.filter(function(k){return k<total});
    var n=state.odPickN; if(n!=null && n!=="all" && opts.indexOf(n)<0) n=null;
    if(n==null) n=(total>5?5:"all"); // はじめては 5文（5文いかの本は ぜんぶ）
    if(!opts.length) n="all";
    var chips=opts.map(function(k){ return '<button class="uchip" data-n="'+k+'">'+k+'文</button>'; }).join("")+
      '<button class="uchip" data-n="all">ぜんぶ（'+total+'文）</button>';
    b.innerHTML='<div class="card"><div style="font-size:52px">🎤</div>'+
      '<h2 style="font-size:20px">音読チェック</h2>'+
      (opts.length?('<div class="od-note" style="text-align:center;margin-top:4px"><b>なん文 よむ？</b></div>'+
        '<div class="od-tools" id="odPick" style="justify-content:center;margin-top:6px">'+chips+'</div>'+
        '<div id="odPickList" class="od-note" style="text-align:left"></div>'):'')+
      '<div class="od-note" style="text-align:left">1文ずつマイクにむかって読むよ。<b>どの単語が読めたか</b>、みどり✓と赤✗でわかる！<br><br>'+
      '① ボタンをおすと <b>新しい画面</b> がひらくよ<br>'+
      '② 「マイクの使用を許可しますか？」→ <b>許可</b> をえらんでね（まいかい きかれる ときは、その画面の 🔔 を見てね）<br>'+
      '③ おわったら、この画面にもどってきてね</div></div>'+
      '<div class="actions"><button class="btn go" id="odOpen">🎤 チェックをはじめる</button></div>';
    var picked=S.slice();
    function setPick(k){
      n=k; if(state.odPickN!==k){ state.odPickN=k; save(); }
      picked=(k==="all")?S.slice():odPickSents(LES,k);
      document.querySelectorAll("#odPick .uchip").forEach(function(c){ c.classList.toggle("on", String(c.dataset.n)===String(k)); });
      var lst=$("#odPickList");
      if(lst){ lst.innerHTML=(k==="all")
        ? '📖 お話を ぜんぶ よむよ（'+total+'文）。さいごまで よむと 📖よんだ回数が ふえるよ'
        : '🎯 きょう よむ '+picked.length+'文（このレッスンの ことばが 入っている文）<br>'+picked.map(function(s){ return '・<span class="en">'+escT(s.en)+'</span>'; }).join('<br>')+
          '<br><span style="opacity:.8">ぜんぶ よむと 📖よんだ回数が ふえるよ</span>'; }
      var btn=$("#odOpen"); if(btn) btn.textContent=(k==="all")?'🎤 チェックをはじめる（ぜんぶ）':'🎤 '+picked.length+'文で チェックをはじめる';
    }
    document.querySelectorAll("#odPick .uchip").forEach(function(c){ c.onclick=function(){ setPick(c.dataset.n==="all"?"all":Number(c.dataset.n)); }; });
    setPick(n);
    $("#odOpen").onclick=function(){
      var part=(picked.length<total);
      state.odPart=part?{id:LES.id, n:picked.length, total:total, t:Date.now()}:null; save();
      openCheckPage("", null, part?picked:null);
    };
  }
  // この画面（クエスト本体）に もどるためのURL（2026-10-14）：判定ページの「クエストにもどる」が window.close() で もどれない時
  //   （LINEの中から Safari に うつった時・ホーム画面の入口から ひらいた時 など＝10/14 保護者さんの報告）に、判定ページが ここへ 自分で もどる。
  //   GitHub Pages版＝いまのURLそのまま／Apps Script版＝exec のURL＋ ?u=名前&k=合言葉（分かる時だけ。無ければ ログイン画面に なるだけ）
  function backUrl(){
    try{
      if(/github\.io$/i.test(location.hostname||"")) return location.origin+location.pathname+location.search;
      var ex=(document.getElementById("execUrl")||{}).value||""; if(ex.indexOf("http")!==0) return "";
      var k=(document.getElementById("autoPw")||{}).value||"", u=(document.getElementById("autoName")||{}).value||"";
      if(!k){ k=($("#lgPw")||{}).value||""; u=k?(USER||""):""; }
      var q=[]; if(u) q.push("u="+encodeURIComponent(u)); if(k) q.push("k="+encodeURIComponent(k));
      return ex+(q.length?"?"+q.join("&"):"");
    }catch(e){ return ""; }
  }
  // 📱 LINEの中の ブラウザで ひらいている時：🎤チェック／🎙️ろくおんは Safari で ひらかれ、おわっても この画面に もどれない（2026-10-14）
  //   → レッスン一覧の上に「Safari で ひらく」を出す（LINE公式の openExternalBrowser=1 で 外のブラウザへ）。それ以外のブラウザでは 何も出さない
  function renderLineBar(){
    var b=$("#lineBar"); if(!b) return;
    try{
      if(!/\bLine\//i.test(navigator.userAgent||"")){ b.innerHTML=""; return; }
      var u=backUrl(); if(!u){ b.innerHTML=""; return; }
      u+=(u.indexOf("?")>=0?"&":"?")+"openExternalBrowser=1";
      b.innerHTML='<div class="card" style="margin:8px 0 4px; text-align:left">'+
        '<div style="font-weight:700">📱 LINEの中だと、🎤チェックや 🎙️ろくおんの あとに ここへ もどれないことが あるよ</div>'+
        '<div class="actions" style="margin-top:8px"><a class="btn go" target="_top" href="'+u.replace(/"/g,"&quot;")+'">Safari で ひらく ▶</a></div></div>';
    }catch(e){ b.innerHTML=""; }
  }
  // 判定ページ（別タブ）を開く。mode="rec"=ろくおんだけ／mode="word"=ハートワード単語判定。Lopt=統合ホームから本文を渡す用
  function openCheckPage(mode, Lopt, sub){
    var L=Lopt||LES;
    var ex=(document.getElementById("execUrl")||{}).value||"";
    if(ex.indexOf("http")!==0) ex=""; // GAS外で開いた時はテンプレート文字列が残るので無効化
    var all=L.sents || (L.words||[]).map(function(w){return {en:w.en, ja:w.ja||""}}); // 音読=文／ハートワード=単語
    var items=(sub&&sub.length)?sub:all; // 2026-10-16 えらんだ文だけ（3文／5文／10文）で チェックできる
    var payload={ name:USER||"", lessonId:L.id, lessonTitle:fullTitle(L), mode:mode||"",
      sents:items.map(function(s){return {en:s.en, ja:s.ja||""}}),
      audio:items.map(function(s){ var e=audioFor(s.en); return (e&&e.f)||"" }),
      pick:(items.length<all.length)?{n:items.length,total:all.length}:null,
      exec:ex, back:backUrl() };
    var h=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    // openExternalBrowser=1：LINEの中のブラウザで開かれた時にSafari/Chromeへ逃がす（LINE公式パラメータ・通常ブラウザでは無視される）
    window.open(CHECK_URL+"?openExternalBrowser=1#"+h, "_blank");
    REC_WAIT=Date.now(); REC_TRIES=0;
  }
  // 🎙️ ほけん（2026-10-01）：ろくおんページ（別タブ）からの 通知が とどかない ことが ある（タブの読みなおし・別ブラウザで ひらいた 等）。
  //   この画面に もどってきたら、シート「音読記録」で 数えなおす → 🎙️の回数・🌍ごちそうが その場で 反映される。
  //   通知が とどいた時（ondokuRecSent）は 不要なので 止める。1回 ひらくごとに 最大3回まで（もどった時＋15秒後＋40秒後）。
  var REC_WAIT=0, REC_TRIES=0, REC_BUSY=false, REC_TMR=null, REC_RAISED={};
  function recResync(){
    if(!REC_WAIT || Date.now()-REC_WAIT>30*60000){ REC_WAIT=0; return; }
    if(REC_BUSY || REC_TRIES>=3 || !USER || document.visibilityState!=="visible") return;
    if(!(CONFIG.backend && window.google && google.script && google.script.run)) return;
    REC_BUSY=true; REC_TRIES++;
    var again=function(){ REC_BUSY=false; clearTimeout(REC_TMR); if(REC_WAIT && REC_TRIES<3) REC_TMR=setTimeout(recResync, REC_TRIES===1?15000:25000); else REC_WAIT=0; };
    try{
      google.script.run.withSuccessHandler(function(res){
        if(res && REC_WAIT){
          var before=state.foodPending||0, n0={}, k; for(k in (state.recN||{})) n0[k]=state.recN[k];
          REC_LIST=res.recs||[]; foodSync(REC_LIST);
          for(k in (state.recN||{})){ if(state.recN[k]>(n0[k]||0)) REC_RAISED[k]=Date.now(); } // シートで 数えた本（おくれて 通知が きても 二重に 数えない）
          var gotChk=0; try{ gotChk=applyPendingChecks(res.checks); }catch(e){} // 🎤 通知が とどかなかった チェックの けっか（2026-10-14）
          if(gotChk) REC_WAIT=0;
          var got=(state.foodPending||0)>before;
          if(got) REC_WAIT=0; // とどいた → もう数えなおさない
          if($("#home").classList.contains("on") && LES) renderHome();
          if(res.fresh && res.fresh.length && !$("#overlay").classList.contains("on")) showBonusModal(res.fresh);
          else if(got && !$("#overlay").classList.contains("on") && ($("#home").classList.contains("on")||$("#lessons").classList.contains("on"))){
            var m=$("#modal");
            m.innerHTML='<div class="big-fruit">🎙️</div><h2>ろくおん とどいたよ！</h2>'+
              '<div class="rscore" style="margin-top:10px">🌍 ごちそうを えらべるよ！</div>'+
              '<button class="btn go" id="ok" style="margin-top:12px">やったー！</button>';
            sfx.win(); confetti();
            $("#overlay").classList.add("on");
            $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); showFoodPick(function(){ if($("#home").classList.contains("on") && LES) renderHome(); else renderTiles(); }); };
          }
        }
        again();
      }).withFailureHandler(function(){ again(); }).getOndokuUpdates(USER);
    }catch(e){ REC_BUSY=false; }
  }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") recResync(); });

  // 🎤 ハートワード：マイク判定ページ（別タブ・単語モード）を開く。結果は postMessage で戻る。

      '① ボタンをおすと <b>新しい画面</b> がひらくよ<br>'+

      '③ おわったら、この画面に もどってきてね</div></div>'+
      '<div class="actions"><button class="btn go" id="hwOpen">🎤 チェックをはじめる</button></div>';
    $("#hwOpen").onclick=function(){ openCheckPage("word"); };
  }
  // 判定ページ（別タブ）からの結果を受け取る
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(String(ev.origin||"").indexOf("github.io")<0) return;
    // 🎙️ ろくおんが先生に送れた：その場で「やったこと」を認めて自動ボーナス+20（先生の返信は任意）
    if(d.type==="ondokuRecSent"){
      REC_WAIT=0; clearTimeout(REC_TMR); // 通知が とどいた → シートでの 数えなおし（recResync）は 不要
      state.recSent=state.recSent||{};
      var rkey=d.lessonId||d.lessonTitle||"rec";

      state.recSent[rkey]=todayStr(0).slice(5).replace("-","/");

      state.recN=state.recN||{};

      else state.recN[rkey]=(state.recN[rkey]||0)+1;
      var newFood=foodCheck(rkey)>0;
      state.score+=20; save();
      var PHR=[
        'きょうも こえに だして よんだね。よんだ ぶんだけ ちからに なるよ。',
        'ろくおん、ちゃんと とどいたよ。じぶんで やった、が いちばん だいじ。',

        'なんども れんしゅうした こえだね。せんせいも きくのが たのしみ。',

      ];

      m.innerHTML='<div class="big-fruit">🎙️</div><h2>ろくおん とどいたよ！</h2>'+
        '<div class="rules-list"><div class="r"><div class="ri">💬</div><div>'+PHR[nSent%PHR.length]+'</div></div></div>'+
        '<div class="rscore" style="margin-top:10px">ていしゅつボーナス +20 ✨<br>'+(newFood?'🌍 ごちそうを えらべるよ！':('🌍 ごちそうまで '+foodDots(rkey)))+'</div>'+
        '<button class="btn go" id="ok" style="margin-top:12px">やったー！</button>';
      sfx.win(); confetti();

      $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); if(newFood) showFoodPick(renderFoodBar); };
      if(LES && (LES.id===rkey || "od_"+LES.id===rkey) && $("#home").classList.contains("on")) renderHome();
      return;
    }
    if(d.type!=="ondokuResult") return;
    if(d.rid){ if(chkDone(d.rid)) return; chkMark(d.rid); } // おなじ けっかを 2回 反映しない（シート経由と 通知の両方が とどいた時）
    REC_WAIT=0; clearTimeout(REC_TMR); // 通知が とどいた → シートからの 拾いなおし（recResync）は 不要
    var lid=d.lessonId||"";
    if(!LES || (LES.mode!=="ondoku" && LES.mode!=="heart") || (lid && LES.id!==lid)){
      // 本を ひらいていない／ちがう本（画面が よみなおされた・ログインしなおした 等）→ その本を さがして 反映（2026-10-14）
      var L2=lid?lessonById(lid):null; if(L2) applyCheckResult(L2, Number(d.pct)||0, d.missed||[], false);

    }

    var pts=Math.round((Number(d.pct)||0)/2); state.score+=pts;

  }, false);

  function odFinish(meta, starsN, extra){

    bumpPlays(LS,meta.id); // 🔁 通算回数（本文は readsBy と同じ数になる）※⭐更新より先に（はじめてのクリアが2回と数えられていた・2026-10-14）
    if(starsN>(LS.cleared[meta.id]||0)) LS.cleared[meta.id]=starsN;
    clearResume(meta.id); // さいごまでやったら「とちゅう」記録は消す
    // 📖 よんだ回数（2026-09-10）：本文を さいごまで読むたび +1（BOOK 1 きく＆リピート／BOOK 2 シャドー／BOOK 3 チェック どれでも1回）。🌍は v2（3回ごと・foodCheck）
    var readsTxt="";

    else if(LES.mode==="ondoku"){

      odSess=null;

      extra=(extra?extra+"<br>":"")+readsTxt; }
    save();

    reportResult({name:USER,lesson:LES.id,lessonTitle:fullTitle(LES),stage:kind+"・"+meta.nm,stars:LS.cleared[meta.id],score:state.score,complete:mergedAllDone(LES,LS)});
    var isAll=mergedAllDone(LES,LS) && !isOpt; // 統合レッスンは単語＋本文の必須ぜんぶで🦋（おまけの後には出し直さない）
    var W2=pairedWord(LES), BLS=W2?lstate(W2.id):LS; // 🦋ボーナスの旗は統合レッスンで1つ（単語側に持つ）
    if(isAll && !BLS.masterBonus){ BLS.masterBonus=1; state.score+=50; save(); extra=(extra?extra+"<br>":"")+"🏅 "+(W2?"レッスン":kind)+"マスターボーナス <b>+50</b>"; }

    $("#overlay").classList.add("on");
    $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); renderHome(); show("home"); if((state.foodPending||0)>0 && foodGot>0) showFoodPick(function(){ if($("#home").classList.contains("on")) renderHome(); }); };

  // ===== 🎤チェックの けっかを「シート」からも 反映する（2026-10-14・10/14 保護者さん報告の対策）=====
  // 判定ページの通知（postMessage）は、LINE→Safari／ホーム画面の入口／タブの読みなおし などで とどかないことがある。
  // 判定ページは けっかを シート「音読記録」にも 送っているので、ログイン時と「もどってきた時」(recResync) に シートから 拾って 反映する。
  // 二重反映は rid（1回ごとの番号）で防ぐ。state.chkDone={rid:時刻}（7日で掃除・☁️合流は 合わせる）
  function chkDone(rid){ return !!(rid && state.chkDone && state.chkDone[rid]); }
  function chkMark(rid){ if(!rid) return; state.chkDone=state.chkDone||{}; state.chkDone[rid]=Date.now();
    var lim=Date.now()-7*86400000, k; for(k in state.chkDone){ if(Number(state.chkDone[k])<lim) delete state.chkDone[k]; } }
  function lessonById(id){ for(var i=0;i<LESSONS.length;i++){ if(LESSONS[i].id===id) return LESSONS[i]; } return null; }
  function lessonByTitle(t){ for(var i=0;i<LESSONS.length;i++){ if(fullTitle(LESSONS[i])===t) return LESSONS[i]; } return null; }
  function refreshScreen(){ try{ if($("#home").classList.contains("on") && LES){ LS=lstate(LES.id); renderHome(); } else if($("#lessons").classList.contains("on")) renderLessons(); }catch(e){} }
  // checks＝getOndokuUpdates の checks（新しい順）。反映できた数を返す。本が まだ 読み込まれていない時は 反映ずみに しない（本文一覧が とどいたら やりなおす）
  var LAST_CHECKS=null;
  function applyPendingChecks(checks){
    if(checks) LAST_CHECKS=checks;
    if(!checks || !checks.length) return 0;
    var n=0, list=checks.slice().reverse(); // 古い順に
    list.forEach(function(c){
      if(!c || !c.rid || chkDone(c.rid)) return;
      var L=(c.lessonId?lessonById(c.lessonId):null) || (c.lesson?lessonByTitle(c.lesson):null);
      if(!L) return;
      chkMark(c.rid);
      if(applyCheckResult(L, Number(c.pct)||0, c.missed||[], true)) n++;
    });
    if(n) save();
    return n;
  }
  // odFinish と同じ中身を、ひらいている本（LES/LS）に たよらず その本（L）に 反映する。fromSheet=true なら「とどいたよ」の見出しで知らせる
  function applyCheckResult(L, pct, missed, fromSheet){
    var meta=stagesFor(L).filter(function(s){return s.id==="check"})[0]; if(!meta) return false;
    var ls=lstate(L.id), kind=(L.mode==="heart")?"ハートワード":"音読";
    var st = pct>=90?3 : pct>=70?2 : 1;
    ls.grow=(ls.grow||0)+3;
    var pts=Math.round((Number(pct)||0)/2); state.score+=pts;
    var g=Math.min((missed||[]).length,8); if(g){ state.gems=(state.gems||0)+g; ls.gems=(ls.gems||0)+g; }
    bumpPlays(ls,meta.id); // ⭐更新より先に
    ls.cleared=ls.cleared||{}; if(st>(ls.cleared[meta.id]||0)) ls.cleared[meta.id]=st;
    if(ls.resume && ls.resume[meta.id]) delete ls.resume[meta.id];
    var extra="正しく読めた語：<b>"+(Number(pct)||0)+"%</b>"+
      (missed&&missed.length?('<br>にがてな語：<span class="en">'+escT(missed.slice(0,12).join(", "))+'</span>'):"")+
      "<br>スコア +"+pts+(g?("　💎おたから +"+g):"");
    var foodGot=0;
    var odp=(L.mode==="ondoku")?odPartialFor(L.id):null;
    if(odp){ state.odPart=null; extra+="<br>🎯 "+odp.n+"文の チェック（ぜんぶ よむと 📖よんだ回数が ふえるよ）"; } // 2026-10-16 えらんだ文だけ
    else if(L.mode==="ondoku"){
      if(odSess && odSess.counted && odSess.id===L.id){ ls.part=Math.max(0,(ls.part||0)-1); odSess=null; }
      ls.reads=(ls.reads||0)+1; ls.readsBy=ls.readsBy||{}; ls.readsBy[meta.id]=(ls.readsBy[meta.id]||0)+1;
      foodGot=foodCheck(L.id);
      extra+="<br>📖 この本を よんだ回数 <b>"+ls.reads+"回</b><br>"+(foodGot>0?"🌍 ごちそうを えらべるよ！":("🌍 ごちそうまで "+foodDots(L.id)));
    }
    var isOpt=isOptStage(L,meta.id);
    if(isOpt){ state.gems=(state.gems||0)+3; ls.gems=(ls.gems||0)+3; extra+="<br>💎 おまけクリア おたから <b>+3</b>"; }
    save();
    reportResult({name:USER,lesson:L.id,lessonTitle:fullTitle(L),stage:kind+"・"+meta.nm,stars:ls.cleared[meta.id],score:state.score,complete:mergedAllDone(L,ls)});
    var isAll=mergedAllDone(L,ls) && !isOpt;
    var W2=pairedWord(L), BLS=W2?lstate(W2.id):ls;
    if(isAll && !BLS.masterBonus){ BLS.masterBonus=1; state.score+=50; save(); extra+="<br>🏅 "+(W2?"レッスン":kind)+"マスターボーナス <b>+50</b>"; }
    var showIt=function(){
      if($("#overlay").classList.contains("on")){ setTimeout(showIt, 2500); return; } // ほかの お知らせが 出ている間は 待つ
      var m=$("#modal");
      m.innerHTML='<div class="big-fruit">'+(isAll?'🏅':meta.fr)+'</div>'+
        (fromSheet?'<div class="rscore">🎤 チェックの けっかが とどいたよ！<br><b>'+escT(fullTitle(L))+'</b></div>':'')+
        '<h2>'+(isAll?kind+'マスター！':meta.nm+' クリア！')+'</h2>'+
        '<div class="rstars">'+stars(ls.cleared[meta.id])+'</div>'+
        '<div class="rscore">'+extra+'</div>'+
        '<button class="btn go" id="ok">つぎへ ▶</button>';
      (isAll?sfx.win:sfx.correct)(); if(isAll)confetti();
      $("#overlay").classList.add("on");
      $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); refreshScreen(); if((state.foodPending||0)>0 && foodGot>0) showFoodPick(refreshScreen); };
    };
    showIt();
    refreshScreen();
    return true;
  }

  function finishStage(){

    // ★星：クリアで⭐⭐。見つけた💎を全部ひろう（＝全部できるようになる）と⭐⭐⭐。減点は無し。
    // ★cleared の初期値に無いステージID（中学651の listenwrite 等）は undefined との比較が

    if(!cur.isReview){ var st=cur.missed.length===0?3:2; bumpPlays(LS,cur.id); if(st>(LS.cleared[cur.id]||0)) LS.cleared[cur.id]=st; } // 🔁 通算回数（おたからチャレンジの再走は数えない）※⭐更新より先に（2026-10-14）
    else { if(cur.missed.length===0 && (LS.cleared[cur.id]||0)<3) LS.cleared[cur.id]=3; }

  function confetti(){
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c=$("#confetti"), x=c.getContext("2d"); c.style.display="block"; c.width=innerWidth; c.height=innerHeight;
    var cols=["#3FA34D","#F4B740","#E4572E","#8A4FA0","#E85D75","#7FCB63"]; var P=[];
    for(var i=0;i<120;i++){P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.4,s:4+Math.random()*6,vx:-2+Math.random()*4,vy:2+Math.random()*4,col:cols[i%cols.length],rot:Math.random()*6,vr:-.2+Math.random()*.4});}
    var t0=null;
    function frame(ts){ if(!t0)t0=ts; var el=ts-t0; x.clearRect(0,0,c.width,c.height);
      P.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.rot+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.col; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); x.restore(); });
      if(el<2600) requestAnimationFrame(frame); else c.style.display="none";
    }
    requestAnimationFrame(frame);
  }

  function doLogin(){
    var name=$("#lgName").value.trim(), pw=$("#lgPw").value; var err=$("#lgErr"); err.textContent="";
    if(!pw){ err.textContent="合言葉（パスワード）を入れてね。"; return; }

      $("#lgBtn").disabled=true; $("#lgBtn").textContent="確認中…";
      loginByPwFlow(pw, function(){ $("#lgBtn").disabled=false; $("#lgBtn").textContent="はじめる ▶"; });
      return;
    }
    if(CONFIG.backend && window.google && google.script){
      $("#lgBtn").disabled=true; $("#lgBtn").textContent="確認中…";
      google.script.run.withSuccessHandler(function(res){
        $("#lgBtn").disabled=false; $("#lgBtn").textContent="はじめる ▶";
        if(res && res.ok){ USER=res.name||name; saveUser(USER); SEED=res.seed||null; saveSeed(SEED); state.course=res.course||""; save(); renderLessons(); show("lessons"); checkOndokuUpdates(); cloudLoad(afterCloud); }
        else if(res && res.expired){ err.textContent="利用期間が終了しています。続けたい時はおうちの人から先生に連絡してね。"; }
        else{ err.textContent="名前かパスワードがちがうみたい。"; }
      }).withFailureHandler(function(){ $("#lgBtn").disabled=false; $("#lgBtn").textContent="はじめる ▶"; err.textContent="つながらないみたい。もう一度。"; }).login(name,pw);
    } else { USER=name; renderLessons(); show("lessons"); }
  }

  // 記憶ログインの再確認：期限切れ・登録解除ならその場でログアウト（通信失敗時は何もしない＝オフラインでも遊べる）
  function revalidateUser(){
    if(!(CONFIG.backend && window.google && google.script && USER)) return;
    google.script.run.withSuccessHandler(function(res){
      if(res && res.ok===false){
        USER=null; clearUser(); $("#lgName").value=""; $("#lgPw").value="";
        $("#lgErr").textContent = res.expired ? "利用期間が終了しています。続けたい時はおうちの人から先生に連絡してね。" : "";

        var c=res.course||"";
        if(c!==(state.course||"")){ state.course=c; save(); if($("#lessons").classList.contains("on")) renderLessons(); }
      }
    }).checkActive(USER);
  }

    {pic:"🦋 ＋ 🐸🐸🐸", t:"ちょうちょに なったら なかまを えらべる", s:"やった日ごとに 1ぴき。4ひきで あたらしい たまご🥚。1週間より ながく あくと たまごに もどる（なかまは そのまま）"},
    {pic:"📖📖📖 → 🌍", t:"おなじ本を 3回 よむと ごちそう", s:"🎙️ろくおんも 1回に かぞえるよ"},
    {pic:"❌ → 💎 → ⭐⭐⭐", t:"まちがえたら おたから", s:"点は へらない。ぜんぶ ひろうと ほし 3つ"}
  ];
  function renderHowto(){
    var hc=$("#hcards"); if(!hc||hc.children.length) return;
    hc.innerHTML=HOWTO.map(function(h,i){ return '<div class="hcard"><div class="hpic">'+h.pic+'</div><div class="ht">'+h.t+'</div><div class="hs">'+h.s+'</div><button class="uchip sm hspk" data-i="'+i+'">🔊 きく</button></div>'; }).join('');
    $("#hdots").innerHTML=HOWTO.map(function(_,i){ return '<span'+(i?'':' class="on"')+'></span>'; }).join('');
    hc.querySelectorAll(".hspk").forEach(function(b){ b.onclick=function(){ var h=HOWTO[+b.dataset.i]; sayJa(h.t+"。"+h.s); }; });
    hc.onscroll=function(){ var i=Math.round(hc.scrollLeft/Math.max(1,hc.clientWidth)); $("#howtoPg").textContent=(i+1)+" / "+HOWTO.length;
      $("#hdots").querySelectorAll("span").forEach(function(d,k){ d.className=k===i?"on":""; }); };
  }
  function openHowto(i){
    renderHowto(); var hc=$("#hcards"); show("howto"); i=i||0;
    hc.scrollLeft=i*hc.clientWidth; $("#howtoPg").textContent=(i+1)+" / "+HOWTO.length;
    var card=$("#tmrCard"); if(card){ var on=tmrEnd>Date.now(); card.querySelectorAll(".uchip").forEach(function(x){ x.classList.toggle("on", on && Math.abs((tmrEnd-Date.now())/60000-parseFloat(x.dataset.min))<15 && parseFloat(x.dataset.min)>0); }); }
  }
  function sayJa(t){
    try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); speechSynthesis.resume();
      var u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=.95; u.pitch=1.05;
      var vs=speechSynthesis.getVoices()||[]; var v=vs.filter(function(x){ return /^ja/i.test(x.lang); })[0]; if(v) u.voice=v;
      speechSynthesis.speak(u); }catch(e){}
  }
  // 2026-10-01 ひろみさん：ひらいたら かならず ホーム。❓は 見たい時だけ（自動では ひらかない）。
  // まだ 1回も 見ていない子には ❓が 小さく光るだけ（とばさない）
  function howtoHint(){
    var b=$("#howtoBtn"); if(!b||!USER) return; var seen=true;
    try{ seen=!!localStorage.getItem("nh2vocab_howto_"+USER); }catch(e){}
    b.classList.toggle("hint", !seen);
  }
  $("#howtoBtn").onclick=function(){ try{ if(USER) localStorage.setItem("nh2vocab_howto_"+USER,"1"); }catch(e){} $("#howtoBtn").classList.remove("hint"); openHowto(0); };
  $("#howtoBack").onclick=function(){ try{ speechSynthesis.cancel(); }catch(e){} renderLessons(); show("lessons"); };
  $("#rulesBtn").onclick=function(){
    var m=$("#modal");
    m.innerHTML='<div class="big-fruit">💎</div><h2 style="margin-bottom:4px">まちがいは お宝！</h2>'+
      '<div class="rscore" style="margin-bottom:8px">まちがえた時こそ、脳が育つ🧠</div>'+
      '<div class="rules-list">'+
      '<div class="r"><div class="ri">💎</div><div><b>まちがい＝おたから</b>　まちがえると💎が見つかる。<b>点は1点も減りません。</b>どんどんチャレンジしよう！</div></div>'+
      '<div class="r"><div class="ri">🧠</div><div><b>なぜ？</b>　人は「まちがえて直した時」に一番よく覚える、と研究でわかっています。だからミスは大かんげい！</div></div>'+
      '<div class="r"><div class="ri">⭐</div><div><b>星</b>　クリアで <b>⭐⭐</b>。見つけた💎を「おたからチャレンジ」で全部ひろうと <b>⭐⭐⭐</b>！</div></div>'+
      '<div class="r"><div class="ri">🦋</div><div><b>ちょうちょに なる</b>　1日に 1つでも やると 🥚→🐛→🫛→🦋 と そだつ。3日で ちょうちょ！（やすんでも もどらない）</div></div>'+
      '<div class="r"><div class="ri">🐾</div><div><b>なかまが ふえる</b>　ちょうちょに なったあと、やった日ごとに 3びきから 1ぴき えらべる（おなじ なかまなら 2 frogs、3 frogs…）。4ひき つれてきたら ちょうちょは もりへ とんで、あたらしい たまご🥚。つぎに うまれる ちょうちょは おたのしみ（せかいの ほんものの ちょうちょ）。1週間より ながく あくと（8日め〜）たまごに もどるよ。なかまと 図鑑は ずっと のこる。</div></div>'+
      '<div class="r"><div class="ri">🏅</div><div><b>レッスン コンプリート</b>　Word 1・2・3 ＋ BOOK 1・2・3 の 6つを ぜんぶ やると 🏅（ボーナス +50）。</div></div>'+
      '<div class="r"><div class="ri">🌍</div><div><b>ごちそうが ふえる</b>　おなじ本を 3回 よむと 1つ えらべる（🎙️ろくおんも 1回に かぞえる）。</div></div>'+
      '<div class="r"><div class="ri">🔥</div><div><b>ノリノリボーナス</b>　つづけて正解するとボーナス点。まちがえても<b>元にもどるだけ・マイナスなし</b>。</div></div>'+
      '</div><button class="btn go" id="ok" style="margin-top:16px">よし、やってみる！</button>';
    $("#overlay").classList.add("on");
    $("#ok").onclick=function(){ $("#overlay").classList.remove("on"); };
  };
  $("#logoutBtn").onclick=function(){ USER=null; clearUser(); FOOT=null; PHOTO_MSG={}; renderFootBar(); $("#lgName").value=""; $("#lgPw").value=""; show("login"); };
  $("#lgBtn").onclick=doLogin;
  $("#lgPw").addEventListener("keydown",function(e){ if(e.key==="Enter")doLogin(); });

  // ===== ⏰ じぶんで決めるタイマー =====
  // レッスン一覧の「きょうは なんぷん やる？」で本人が選ぶ。時間が来たら「じかんだよ！」→おしまい。
  var tmrEnd=0, tmrIv=null, tmrPill=null, tmrExtended=false;
  function tmrStart(min){
    tmrEnd=Date.now()+min*60000;
    if(!tmrPill){ tmrPill=document.createElement("div"); tmrPill.id="tmrPill"; document.body.appendChild(tmrPill); }
    tmrPill.style.display="block";
    clearInterval(tmrIv); tmrIv=setInterval(tmrTick,500); tmrTick();
  }
  function tmrTick(){
    var s=Math.max(0,Math.ceil((tmrEnd-Date.now())/1000));
    tmrPill.textContent="⏰ "+Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);
    tmrPill.className = s<=60?"danger":(s<=180?"warn":"");
    if(s<=0){ clearInterval(tmrIv); tmrUp(); }
  }
  function tmrUp(){
    try{ stopVoice(); }catch(e){}
    odGen++;
    tmrPill.style.display="none";
    var m=$("#modal");
    m.innerHTML='<div class="big-fruit">⏰</div><h2>じかんだよ！</h2>'+
      '<div class="rscore">じぶんで きめた じかんを やりきったね 🦋<br>スコア '+state.score+'</div>'+
      '<button class="btn go" id="tmrBye">おしまい 👋</button>'+
      (tmrExtended?'':'<button class="link" id="tmrMore" style="margin-top:8px">あと1ぷんだけ（しあげ）</button>');
    sfx.win(); confetti();
    $("#overlay").classList.add("on");
    $("#tmrBye").onclick=function(){
      document.body.innerHTML='<div style="max-width:480px; margin:60px auto; padding:16px; text-align:center; font-family:var(--font-round)">'+
        '<div style="font-size:72px">🦋</div><h2>きょうは ここまで！</h2><p style="color:var(--muted)">よく がんばりました。また あそぼうね 👋</p></div>';
    };
    var mo=$("#tmrMore");
    if(mo) mo.onclick=function(){ tmrExtended=true; $("#overlay").classList.remove("on"); tmrStart(1); };
  }
  (function(){
    var card=$("#tmrCard"); if(!card) return;
    card.querySelectorAll(".uchip").forEach(function(ch){
      ch.onclick=function(){
        var min=parseFloat(ch.dataset.min)||0;
        card.querySelectorAll(".uchip").forEach(function(x){ x.classList.remove("on"); }); ch.classList.add("on");
        if(min>0){ tmrStart(min); renderLessons(); show("lessons"); }
        else { clearInterval(tmrIv); if(tmrPill) tmrPill.style.display="none"; }
      };
    });
  })();

  // ===== 起動 =====
  if(CONFIG.requireLogin){
    var autoName=(document.getElementById("autoName")||{}).value||"";
    var autoPw=(document.getElementById("autoPw")||{}).value||"";
    var remembered=loadUser();
    if(autoPw && !autoName){ // パスワードだけのURL（?k=合言葉）→ 名前は後でシートに記入OK
      show("login"); loginByPwFlow(autoPw);
    } else if(autoName && autoPw){ // 名前＋合言葉URL（従来）→毎回自動ログイン
      $("#lgName").value=autoName; $("#lgPw").value=autoPw; show("login"); doLogin();
    } else if(remembered){ USER=remembered; SEED=loadSeed(); renderLessons(); show("lessons"); checkOndokuUpdates(); revalidateUser(); cloudLoad(afterCloud); } // 前回ログイン済み→パスワード省略（裏で有効期限を確認）
    else{ show("login"); }
  } else { renderLessons(); show("lessons"); }
})();
</script>

</body>
</html>
