<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技あつめクエスト L66〜76</title>
<style>
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;margin:0;background:#0f2b1d;color:#333}
  .wrap{max-width:520px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:20px;color:#fff;text-align:center;margin:10px 0 2px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
  .sub{color:#bfe3cf;text-align:center;font-size:13px;margin-bottom:14px}
  .rule{background:#fff8e7;border-radius:12px;padding:10px 14px;font-size:14px;text-align:center;font-weight:bold;color:#7a5200;margin-bottom:14px}
  .zone{background:linear-gradient(160deg,#fdfdf8,#eef8f1);border-radius:18px;padding:16px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .zone h2{font-size:17px;color:#2c6e49;text-align:center;margin:2px 0 4px}
  .progress{text-align:center;font-size:14px;color:#555;margin-bottom:10px}
  .bar{height:12px;background:#dfe9e3;border-radius:6px;overflow:hidden;margin:6px 12px 12px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#57c785,#2c6e49);border-radius:6px;transition:width .5s}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{position:relative;background:#fff;border:2.5px solid #cde3d5;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;user-select:-webkit-user-select;user-select:none;transition:all .3s;-webkit-tap-highlight-color:transparent}
  .card .emo{font-size:26px;display:block}
  .card b{display:block;font-size:15px;color:#2c6e49;margin-top:2px}
  .card small{font-size:11px;color:#666;display:block;line-height:1.3;margin-top:2px}
  .card.done{background:#e9ecea;border-color:#b9c4bd;filter:grayscale(1);opacity:.65}
  .card.done::after{content:"⭐";position:absolute;top:-10px;right:-6px;font-size:26px;filter:none;opacity:1;text-shadow:0 1px 3px rgba(0,0,0,.3);animation:pop .4s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
  .locked{position:relative;overflow:hidden}
  .locked .grid{filter:blur(3px) grayscale(.7);pointer-events:none}
  .lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;color:#2c6e49;font-size:15px;background:rgba(255,255,255,.55);border-radius:18px}
  .lockmsg span{font-size:34px}
  .clear{display:none;text-align:center;background:#fff3b0;border-radius:12px;padding:12px;margin-top:12px;font-weight:bold;color:#8a6d00;font-size:15px;animation:pop .5s}
  .zone.allclear .clear{display:block}
  .reset{display:block;margin:30px auto 0;font-size:11px;color:#7fa78f;background:none;border:1px solid #3f6a52;border-radius:8px;padding:4px 12px}
</style>
</head>
<body>
<div class="wrap">

<h1>🗡 技あつめクエスト L66〜76</h1>
<p class="sub">次のステージにいどむ前に、かくれた技を集めよう！</p>
<div class="rule">ルール：1日1ブック・3回よむ・3回目を送信！<br>送ったら カードをタップ → スタンプGET⭐</div>

<div class="zone" id="zone1">
  <h2>🧩 -le ゾーン</h2>
  <div class="progress"><span id="cnt1">0</span> / 2 クリア</div>
  <div class="bar"><i id="bar1"></i></div>
  <div class="grid" id="grid1"></div>
  
  <div class="clear">🎉 🧩 -le ゾーン クリア！<br>「📏 ながい単語ゾーン」が ひらいた！🔓</div>
</div>

<div class="zone locked" id="zone2">
  <h2>📏 ながい単語ゾーン</h2>
  <div class="progress"><span id="cnt2">0</span> / 4 クリア</div>
  <div class="bar"><i id="bar2"></i></div>
  <div class="grid" id="grid2"></div>
  <div class="lockmsg" id="lock2"><span>🔒</span>🧩 -le ゾーンを<br>クリアすると ひらくよ！</div>
  <div class="clear">🏆 ぜんぶクリア！次のステージにいどむ準備かんりょう！<br>先生に ほうこくしよう！</div>
</div>

<button class="reset" onclick="if(confirm('スタンプを ぜんぶ消す？（先生用）')){localStorage.removeItem(KEY);location.reload()}">リセット（先生用）</button>

<script>
const KEY='quest_l66_76_v1';
const Z1=[
 ['🍫','L75',"Maple Fudge"],
 ['🌴','L76',"A Trip to the Jungle"]];
const Z2=[
 ['🤝','L66',"Jo's Friend Russ"],
 ['🏖','L67a',"Mo and the Sandbox"],
 ['🚀','L67b',"The Rocket Contest"],
 ['🎶','L68',"Music Class"]];
let state=JSON.parse(localStorage.getItem(KEY)||'{}');

function build(zone,items,gridId){
  const g=document.getElementById(gridId);
  items.forEach(([emo,ls,title])=>{
    const d=document.createElement('div');
    d.className='card'+(state[ls]?' done':'');
    d.innerHTML=`<span class="emo">${emo}</span><b>${ls}</b><small>${title}</small>`;
    d.onclick=()=>{state[ls]=!state[ls];localStorage.setItem(KEY,JSON.stringify(state));d.classList.toggle('done',!!state[ls]);update()};
    g.appendChild(d);
  });
}
function update(){
  const c1=Z1.filter(([,ls])=>state[ls]).length; cnt1.textContent=c1; bar1.style.width=(c1/2*100)+'%';
  const c2=Z2.filter(([,ls])=>state[ls]).length; cnt2.textContent=c2; bar2.style.width=(c2/4*100)+'%';
  document.getElementById('zone1').classList.toggle('allclear',c1===2);
  const z2=document.getElementById('zone2');
  if(c1===2){z2.classList.remove('locked');lock2.style.display='none'}
  else{z2.classList.add('locked');lock2.style.display='flex'}
  z2.classList.toggle('allclear',c2===4);
}
build(1,Z1,'grid1');build(2,Z2,'grid2');update();
</script>
</div>
</body>
</html>
